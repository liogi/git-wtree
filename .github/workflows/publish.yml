name: Publish

# Tags, not merges. Merging means the code is good; tagging means you meant to
# ship it. Keeping them separate leaves the release an explicit act.
on:
  push:
    tags: ["v*"]

# This one line is the whole authentication story. GitHub mints a short-lived
# OIDC token, npm checks it against the trusted publisher configured for this
# repository and this workflow filename, and hands back a credential good for
# one submission. Nothing long-lived is stored anywhere — renaming this file
# breaks the trust, which is the trade.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No `cache: npm` here, deliberately — npm's own guidance is to avoid
      # caching in release builds, so what ships is built from what the registry
      # serves today rather than from a restored artifact.
      #
      # No `registry-url` either, and that one is not cosmetic: it makes
      # setup-node write an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`.
      # With no token secret to fill it, the variable stays at its literal
      # placeholder, npm finds credentials, uses them, and never falls back to
      # OIDC — failing with E401 as though the token had expired. Publishing
      # goes to registry.npmjs.org by default anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Staged publishing needs npm >= 11.15.0 and Node 24 bundles 11.11.
      # Pinned to 11 rather than latest: npm 12 requires a Node patch level the
      # runner image does not always have, and this only needs to clear 11.15.
      - run: npm install -g npm@11

      - run: npm ci

      # A tag is a promise about something that will exist forever. Test before
      # keeping it, even though CI already tested the commit.
      - run: npm test

      # Tagging v0.8.1 while package.json still reads 0.8.0 publishes the wrong
      # version under a name that looks right, and there is no unpublishing.
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      # Staged, not published. CI can submit a build but cannot make it public:
      # the trusted publisher is configured for `npm stage publish` only, so a
      # compromised repository or workflow can propose a version and no more.
      # Making it live needs `npm stage approve <id>` with 2FA, from a human.
      #
      # No token and no --provenance flag — OIDC attaches the attestation on its
      # own, so npmjs.com can show which commit and which workflow built this.
      - run: npm stage publish

      - name: What happens next
        run: |
          echo "::notice::Staged. Approve with: npm stage list git-wtree && npm stage approve <id>"
