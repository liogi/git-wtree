name: CI

on:
  push:
    branches: [main]
  pull_request:

# `npm test` builds, type-checks the tests, then runs them against the built
# binary. The security-critical assertions that used to live here as bash — a
# branch name must not execute, an unapproved .gitwtree.json must not run, add
# must not discard unpushed commits — are tests now, so they can be run locally
# with one command instead of being copy-pasted out of this file.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors package.json `engines.node` (>=22.12, set by commander@15).
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # No git identity step: the fixtures set user.name/user.email per repo, so
      # the suite passes with an empty global config (verified).
      - run: npm test
